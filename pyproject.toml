[project]
name = "mel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1",
    "fire>=0.7.1",
    "gin-config>=0.5.0",
    "ipython>=9.6.0",
    "numba>=0.61.2",
    "orjson>=3.11.3",
    "pandas>=2.3.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "python-fire>=0.1.0",
    "scann>=1.4.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.1",
    "wandb>=0.21.3",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "--ignore=tests/models/test_faiss_searcher.py"
